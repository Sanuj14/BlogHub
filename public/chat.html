<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat — BlogHub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .chat-layout { display: grid; grid-template-columns: 320px 1fr; min-height: calc(100vh - 64px); border: var(--bd); background: var(--paper-2); }
    .chat-sidebar { border-right: var(--bd); display: flex; flex-direction: column; overflow: hidden; }
    .chat-sidebar-head { padding: 18px; border-bottom: var(--bd); }
    .chat-sidebar-head h2 { font-size: 1.2rem; margin-bottom: 12px; }
    .chat-list { flex: 1; overflow-y: auto; }
    .chat-item { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: var(--bd); cursor: pointer; transition: background .1s; }
    .chat-item:hover, .chat-item.active { background: var(--yellow); }
    .chat-item .avatar { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; flex: none; background: var(--yellow); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 900; font-size: .85rem; border: var(--bd); }
    .chat-item .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .chat-item .info { flex: 1; min-width: 0; }
    .chat-item .info .name { font-family: var(--font-display); font-size: .82rem; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chat-item .info .preview { font-size: .78rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
    .chat-item .badge { background: var(--red); color: #fff; font-family: var(--font-mono); font-size: .66rem; font-weight: 700; min-width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; border-radius: 50%; flex: none; }
    .chat-main { display: flex; flex-direction: column; }
    .chat-header { padding: 14px 22px; border-bottom: var(--bd); display: flex; align-items: center; gap: 12px; background: var(--paper); }
    .chat-header .name { font-family: var(--font-display); font-size: .95rem; text-transform: uppercase; }
    .chat-header .username { font-family: var(--font-mono); font-size: .75rem; color: var(--muted); }
    .chat-messages { flex: 1; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 10px; }
    .chat-empty { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; padding: 40px; }
    .chat-empty .ic { font-size: 2.4rem; margin-bottom: 14px; color: var(--muted); }
    .chat-empty p { font-family: var(--font-mono); color: var(--muted); text-transform: uppercase; font-size: .82rem; }
    .msg { max-width: 70%; padding: 10px 14px; border: var(--bd); font-size: .92rem; line-height: 1.45; word-break: break-word; }
    .msg.sent { align-self: flex-end; background: var(--yellow); }
    .msg.received { align-self: flex-start; background: var(--paper-2); }
    .msg .time { font-family: var(--font-mono); font-size: .66rem; color: var(--muted); margin-top: 4px; }
    .chat-input { display: flex; gap: 0; border-top: var(--bd); }
    .chat-input input { flex: 1; padding: 14px 18px; border: none; font: inherit; font-size: .95rem; background: var(--paper-2); outline: none; }
    .chat-input button { padding: 14px 22px; background: var(--ink); color: var(--paper); border: none; border-left: var(--bd); cursor: pointer; font-family: var(--font-mono); font-weight: 700; font-size: .82rem; text-transform: uppercase; transition: background .1s; }
    .chat-input button:hover { background: var(--yellow); color: var(--ink); }
    .chat-back { display: none; background: none; border: none; font-size: 1.1rem; cursor: pointer; padding: 4px; }
    @media (max-width: 640px) {
      .chat-layout { grid-template-columns: 1fr; }
      .chat-sidebar { display: flex; }
      .chat-layout.chat-open .chat-sidebar { display: none; }
      .chat-layout.chat-open .chat-main { display: flex; }
      .chat-layout:not(.chat-open) .chat-main { display: none; }
      .chat-back { display: block; }
      .msg { max-width: 85%; }
    }
  </style>
</head>
<body data-page="chat">
  <div id="site-nav"></div>

  <div class="chat-layout" id="chatLayout">
    <div class="chat-sidebar">
      <div class="chat-sidebar-head">
        <h2>Messages</h2>
        <div style="position:relative">
          <input class="input" id="userSearch" type="search" placeholder="Search users..." autocomplete="off" style="font-size:.85rem;padding:10px 12px" />
        </div>
      </div>
      <div class="chat-list" id="chatList">
        <div class="spinner"></div>
      </div>
    </div>
    <div class="chat-main" id="chatMain">
      <div class="chat-empty" id="chatEmpty">
        <div>
          <div class="ic"><i class="fa-regular fa-comments"></i></div>
          <p>Select a conversation or search for a user to start chatting.</p>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/chat.js"></script>
</body>
</html>
